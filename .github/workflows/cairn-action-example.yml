# Example caller for the in-repo composite Action (PLAN.md §16).
# Pin oci_image to the same @sha256 digest ECS/local use. argv_json is a
# JSON array — never a shell string. Fork PRs get no publish credentials.
#
# DAY-6 CUT (2026-08-10): OIDC→namespace_principals short-lived token
# exchange is NOT wired (schema table exists in 0010; no exchange service
# in src/). Do not put this Action in the judged video as shared-claim
# evidence. Demo shared-claim path = two ECS callers on the same pinned
# digest (Gate D whole-stage / scripts/gate_d_whole_stage.py pattern).
# This workflow remains documentation/example only.
name: cairn-action-example
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cairn jsonl-map
        id: cairn
        uses: ./.github/actions/cairn
        with:
          contract: jsonl-map/v1
          argv_json: '["python","/workspace/examples/embed_mapper.py"]'
          input_file: data/cairnbench.jsonl
          id_field: id
          partitions: '64'
          output_file: artifacts/features.jsonl
          # Replace with the frozen ECS/local digest before claiming shared identity.
          oci_image: 357199110611.dkr.ecr.us-east-1.amazonaws.com/cairn@sha256:REPLACE_WITH_REAL_DIGEST
          namespace: ci
        env:
          # Prefer a short-lived namespace token from OIDC exchange — never a
          # long-lived global CAS role in Actions secrets for untrusted PRs.
          CAIRN_DATABASE_URL: ${{ secrets.CAIRN_DATABASE_URL }}
          CAIRN_S3_BUCKET: ${{ secrets.CAIRN_S3_BUCKET }}
          CAIRN_NAMESPACE_TOKEN: ${{ secrets.CAIRN_NAMESPACE_TOKEN }}
