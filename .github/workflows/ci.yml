# CI — docs/project/PLAN.md D10.
#
# Four jobs always run and need no secrets: lint, typecheck, the Python
# unit/property suites, and a real frontend build. A fifth job runs the
# integration suite against a REAL, ephemeral CockroachDB Cloud cluster and is
# gated on a service-account key being configured.
#
# That gate is deliberate and is the honest option, not a shortcut. This
# repository has one absolute rule (docs/project/PLAN.md §5): nothing that claims to be an
# integration test may mock the database. The concurrency tests in particular —
# a 200-iteration duplicate-claim race, a dispossessed-write test, a takeover
# test — are only meaningful against a real SERIALIZABLE engine; running them
# against a stub would produce a green check that means nothing. So rather than
# fake a green integration step, the job skips with a stated reason until
# CCLOUD_API_KEY exists. See the TODO block on that job for exactly what to add.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# PYTHONHASHSEED can only be set before the interpreter starts, never from
# inside a running process — workload/determinism.py refuses to run otherwise
# and says so rather than silently claiming a guarantee that isn't true.
env:
  PYTHONHASHSEED: "0"
  UV_VERSION: "0.10.7"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check src tests scripts
      - name: ruff format --check
        run: uv run ruff format --check src tests scripts

  typecheck:
    name: Typecheck (mypy, strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  test:
    name: Unit + property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      # No CAIRN_DATABASE_URL is set for this job, on purpose: these suites must
      # pass with no cluster reachable at all. If one of them ever starts
      # needing a database, it belongs in the integration job instead.
      - name: pytest tests/unit tests/property
        run: uv run pytest tests/unit tests/property -q

  console:
    name: Console (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: console/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run typecheck
      # A real production build. The public demo URL is a pass/fail submission
      # requirement (docs/project/PROJECT.md §0/§9), so "the frontend compiles" is a merge
      # gate, not a nicety.
      - run: npm run build

  integration:
    name: Integration (real CockroachDB, no mocks)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    # ---------------------------------------------------------------------
    # TODO(secrets): this job is inert until the following repository secrets
    # exist. Nothing else is required — the scripts it calls are already in
    # the repo and are the same ones a human runs locally.
    #
    #   CCLOUD_API_KEY   A CockroachDB Cloud *service account* API key with
    #                    permission to create and delete clusters. Create it at
    #                    Cloud Console -> Access Management -> Service Accounts,
    #                    then Add API Key. Used non-interactively by `ccloud`.
    #
    # Optional, only if the integration suite should exercise the LLM paths
    # rather than the documented CAIRN_NO_LLM fallback:
    #   AWS_ROLE_TO_ASSUME   An IAM role ARN trusted by GitHub's OIDC provider,
    #                        granting bedrock:InvokeModel on the two model ARNs
    #                        and bedrock-mantle:CreateInference on the project
    #                        ARN (see infra/iam.tf). Prefer OIDC over static
    #                        keys; do not add AWS_SECRET_ACCESS_KEY here.
    #
    # Until CCLOUD_API_KEY is set this job is skipped, and that is the intended
    # state — see the header comment. Do not "fix" it by pointing the suite at
    # a stub.
    # ---------------------------------------------------------------------
    if: ${{ github.repository_owner != '' && vars.ENABLE_INTEGRATION == 'true' }}
    env:
      CAIRN_CLUSTER_NAME: cairn-ci-${{ github.run_id }}
      CAIRN_NO_LLM: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --frozen

      - name: Guard — refuse to run without a real cluster credential
        run: |
          if [ -z "${{ secrets.CCLOUD_API_KEY }}" ]; then
            echo "::error::CCLOUD_API_KEY is not set. This job runs the race and"
            echo "::error::determinism suites against a real cluster; it will not"
            echo "::error::run them against anything else. See the TODO in ci.yml."
            exit 1
          fi

      - name: Install ccloud
        run: |
          curl -fsSL https://binaries.cockroachdb.com/ccloud/ccloud_linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin ccloud
          ccloud --version

      - name: Provision an ephemeral cluster
        env:
          CCLOUD_API_KEY: ${{ secrets.CCLOUD_API_KEY }}
        run: ./scripts/provision_cluster.sh

      - name: Apply migrations
        run: |
          set -a && . ./.env && set +a
          uv run python scripts/migrate.py

      # The suite that cannot be faked: 200-iteration duplicate-claim race,
      # dispossessed-write, safe takeover, fragment resume, subscribe-and-adopt,
      # and vector search in BOTH modes (indexed and brute-force fallback).
      - name: Integration suite
        run: |
          set -a && . ./.env && set +a
          uv run pytest tests/integration -v

      - name: Duplicate-claim race, 200 iterations
        run: |
          set -a && . ./.env && set +a
          uv run python scripts/race.py --iterations 200

      # `if: always()` so a failed assertion never leaves a billable cluster
      # running. Teardown is the one step that must not be skipped.
      - name: Delete the ephemeral cluster
        if: always()
        env:
          CCLOUD_API_KEY: ${{ secrets.CCLOUD_API_KEY }}
        run: ccloud cluster delete "$CAIRN_CLUSTER_NAME" || true
