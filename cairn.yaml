version: 1

data:
  # Versioned snapshot uploaded by scripts/vendor_dataset.py. The object is
  # s3://cairn-demo-111122223333/datasets/20news-4cat-v1/raw.parquet in the
  # deployed demo environment; downstream work keys track this value.
  snapshot_digest: 20news-4cat-v1

dataset:
  test_every_nth: 5

features:
  model: sentence-transformers/all-MiniLM-L6-v2
  embedding_dim: 384
  max_seq_length: 256
  batch_size: 32
  shard_count: 3

train:
  input_dim: 384
  hidden_dim: 256
  num_labels: 4
  epochs: 12
  learning_rate: 0.001
  batch_size: 32

eval:
  metrics:
    - accuracy
    - macro_f1
