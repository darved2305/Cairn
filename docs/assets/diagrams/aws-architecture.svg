ints="800.0,390.0 789.0,394.4 789.0,385.6" fill="#334155" stroke="none"/><polyline points="700.0,490.0 750.0,490.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polyline points="750.0,490.0 800.0,490.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="800.0,490.0 789.0,494.4 789.0,485.6" fill="#334155" stroke="none"/><polyline points="750.0,190.0 750.0,490.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="40.0" y="602.9" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Every task pulls the same immutable image digest from ECR and reads its database URL from Secrets Manager.</tspan><tspan x="40.0" dy="17.5">The console and both workers also use S3 and Bedrock; the reaper only touches CockroachDB.</tspan><tspan x="40.0" dy="17.5">CloudWatch collects logs, metrics, and four alarms. There is no NAT Gateway anywhere.</tspan></text></svg>
