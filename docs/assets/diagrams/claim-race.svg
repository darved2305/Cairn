 fill="#FECACA" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="190.0" y="794.1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="190.0" dy="0.0">worker A comes back</tspan></text><text x="190.0" y="816.8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="190.0" dy="0.0">still believes it owns the work</tspan></text><polyline points="190.0,880.0 630.0,880.0" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="630.0,880.0 619.0,884.4 619.0,875.6" fill="#DC2626" stroke="none"/><text x="410.0" y="866.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="500" fill="#DC2626" text-anchor="middle" xml:space="preserve"><tspan x="410.0" dy="0.0">publish(fence 1)</tspan></text><polyline points="630.0,936.0 190.0,936.0" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><polygon points="190.0,936.0 201.0,931.6 201.0,940.4" fill="#DC2626" stroke="none"/><text x="410.0" y="922.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="500" fill="#DC2626" text-anchor="middle" xml:space="preserve"><tspan x="410.0" dy="0.0">REJECTED_FENCE · zero rows updated</tspan></text><text x="630.0" y="1004.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle" xml:space="preserve"><tspan x="630.0" dy="0.0">Every step above is one SERIALIZABLE transaction, replayed whole o