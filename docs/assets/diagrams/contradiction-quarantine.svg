<svg xmlns="http://www.w3.org/2000/svg" width="1466" height="552" viewBox="12.0 -4.0 1466.0 552.0" role="img"><rect x="12.0" y="-4.0" width="1466.0" height="552.0" fill="#FFFFFF"/><text x="40.0" y="43.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">When a reuse turns out to be wrong</tspan></text><text x="40.0" y="67.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Quarantine is one-way, transitive, and recorded.</tspan></text><rect x="40.0" y="140.0" width="250.0" height="150.0" rx="16.0" fill="#BBF7D0" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="165.0" y="200.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="165.0" dy="0.0">Reuse happened</tspan></text><text x="165.0" y="224.2" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="165.0" dy="0.0">authorized by identity,</tspan><tspan x="165.0" dy="16.2">structure, or a probe</tspan></text><rect x="330.0" y="140.0" width="250.0" height="150.0" rx="16.0" fill="#FECACA" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="455.0" y="200.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="455.0" dy="0.0">Contradiction</tspan></text><text x="455.0" y="224.2" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="455.0" dy="0.0">a later run produces evidence</tspan><tspan x="455.0" dy="16.2">that disagrees</tspan></text><rect x="620.0" y="140.0" width="250.0" height="150.0" rx="16.0" fill="#DDD6FE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="745.0" y="208.1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="745.0" dy="0.0">contradictions row</tspan></text><text x="745.0" y="232.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="745.0" dy="0.0">written in the same transaction</tspan></text><rect x="910.0" y="140.0" width="250.0" height="150.0" rx="16.0" fill="#FECACA" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1035.0" y="191.8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1035.0" dy="0.0">Artifact quarantined</tspan></text><text x="1035.0" y="216.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1035.0" dy="0.0">and every artifact downstream</tspan><tspan x="1035.0" dy="16.2">of it, walked through</tspan><tspan x="1035.0" dy="16.2">artifact_inputs</tspan></text><rect x="1200.0" y="140.0" width="250.0" height="150.0" rx="16.0" fill="#FEF3C7" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1325.0" y="183.7" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1325.0" dy="0.0">Rule tightened</tspan></text><text x="1325.0" y="208.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1325.0" dy="0.0">the reuse rule head advances; a</tspan><tspan x="1325.0" dy="16.2">publish carrying the stale</tspan><tspan x="1325.0" dy="16.2">revision returns</tspan><tspan x="1325.0" dy="16.2">STALE_AUTHORITY</tspan></text><polyline points="290.0,215.0 330.0,215.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="330.0,215.0 319.0,219.4 319.0,210.6" fill="#334155" stroke="none"/><polyline points="580.0,215.0 620.0,215.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="620.0,215.0 609.0,219.4 609.0,210.6" fill="#334155" stroke="none"/><polyline points="870.0,215.0 910.0,215.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="910.0,215.0 899.0,219.4 899.0,210.6" fill="#334155" stroke="none"/><polyline points="1160.0,215.0 1200.0,215.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1200.0,215.0 1189.0,219.4 1189.0,210.6" fill="#334155" stroke="none"/><rect x="785.0" y="400.0" width="400.0" height="120.0" rx="16.0" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="985.0" y="452.7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="14.5" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="985.0" dy="0.0">cairn unquarantine &lt;id&gt; --reason "..."</tspan></text><text x="985.0" y="476.4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="985.0" dy="0.0">the only way back, and the reason is recorded</tspan></text><polyline points="1035.0,290.0 1035.0,400.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1035.0,400.0 1030.6,389.0 1039.4,389.0" fill="#334155" stroke="none"/></svg>
