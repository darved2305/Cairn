<svg xmlns="http://www.w3.org/2000/svg" width="1426" height="661" viewBox="12.0 -4.0 1426.0 660.8" role="img"><rect x="12.0" y="-4.0" width="1426.0" height="660.8" fill="#FFFFFF"/><text x="40.0" y="43.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Failure memory</tspan></text><text x="40.0" y="67.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Similarity retrieves candidates. Recorded evidence decides whether execution changes.</tspan></text><rect x="40.0" y="250.0" width="250.0" height="130.0" rx="16.0" fill="#F8FAFC" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="165.0" y="300.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="165.0" dy="0.0">Proposed run</tspan></text><text x="165.0" y="324.8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="165.0" dy="0.0">stage · error class ·</tspan><tspan x="165.0" dy="16.2">structured causal features</tspan></text><rect x="360.0" y="250.0" width="270.0" height="130.0" rx="16.0" fill="#DDD6FE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495.0" y="292.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="495.0" dy="0.0">Failure memory</tspan></text><text x="495.0" y="316.7" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="495.0" dy="0.0">structured match, plus 1024-d</tspan><tspan x="495.0" dy="16.2">Titan embedding search over</tspan><tspan x="495.0" dy="16.2">normalised failure summaries</tspan></text><rect x="710.0" y="110.0" width="300.0" height="130.0" rx="16.0" fill="#FECACA" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="860.0" y="160.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="860.0" dy="0.0">exact</tspan></text><text x="860.0" y="184.2" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="860.0" dy="0.0">every causal feature equal, same</tspan><tspan x="860.0" dy="16.2">framework version and instance kind</tspan></text><rect x="1090.0" y="110.0" width="320.0" height="130.0" rx="16.0" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1250.0" y="170.4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1250.0" dy="0.0">Refuse. Propose the remediation that</tspan><tspan x="1250.0" dy="17.5">actually worked.</tspan></text><polyline points="1010.0,175.0 1090.0,175.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1090.0,175.0 1079.0,179.4 1079.0,170.6" fill="#334155" stroke="none"/><polyline points="630.0,315.0 670.0,315.0 670.0,175.0 710.0,175.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="710.0,175.0 699.0,179.4 699.0,170.6" fill="#334155" stroke="none"/><rect x="710.0" y="270.0" width="300.0" height="130.0" rx="16.0" fill="#FEF3C7" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="860.0" y="311.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="860.0" dy="0.0">strong_semantic</tspan></text><text x="860.0" y="336.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="860.0" dy="0.0">cosine ≤ 0.15, same stage and error</tspan><tspan x="860.0" dy="16.2">class, at least one causal feature</tspan><tspan x="860.0" dy="16.2">agreeing</tspan></text><rect x="1090.0" y="270.0" width="320.0" height="130.0" rx="16.0" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1250.0" y="330.4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1250.0" dy="0.0">Refuse with evidence. Needs a changed</tspan><tspan x="1250.0" dy="17.5">plan, or --override.</tspan></text><polyline points="1010.0,335.0 1090.0,335.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1090.0,335.0 1079.0,339.4 1079.0,330.6" fill="#334155" stroke="none"/><polyline points="630.0,315.0 670.0,315.0 670.0,335.0 710.0,335.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="710.0,335.0 699.0,339.4 699.0,330.6" fill="#334155" stroke="none"/><rect x="710.0" y="430.0" width="300.0" height="130.0" rx="16.0" fill="#BFDBFE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="860.0" y="480.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="860.0" dy="0.0">weak</tspan></text><text x="860.0" y="504.2" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="860.0" dy="0.0">cosine ≤ 0.35, no structured agreement</tspan><tspan x="860.0" dy="16.2">beyond the stage</tspan></text><rect x="1090.0" y="430.0" width="320.0" height="130.0" rx="16.0" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1250.0" y="490.4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1250.0" dy="0.0">Advisory only. Never blocks, and says</tspan><tspan x="1250.0" dy="17.5">so.</tspan></text><polyline points="1010.0,495.0 1090.0,495.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1090.0,495.0 1079.0,499.4 1079.0,490.6" fill="#334155" stroke="none"/><polyline points="630.0,315.0 670.0,315.0 670.0,495.0 710.0,495.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="710.0,495.0 699.0,499.4 699.0,490.6" fill="#334155" stroke="none"/><polyline points="290.0,315.0 360.0,315.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="360.0,315.0 349.0,319.4 349.0,310.6" fill="#334155" stroke="none"/><text x="725.0" y="624.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle" xml:space="preserve"><tspan x="725.0" dy="0.0">A tier can only reach exact or strong_semantic when a prior remediation recorded which features were actually causal.</tspan></text></svg>
