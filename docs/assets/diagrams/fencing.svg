<svg xmlns="http://www.w3.org/2000/svg" width="1186" height="541" viewBox="12.0 -4.0 1186.0 541.4" role="img"><rect x="12.0" y="-4.0" width="1186.0" height="541.4" fill="#FFFFFF"/><text x="40.0" y="43.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Why a lease is not enough</tspan></text><text x="40.0" y="67.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">A lease says who may run. A fence says whose write still counts.</tspan></text><rect x="40.0" y="130.0" width="270.0" height="104.0" rx="16.0" fill="#FECACA" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="175.0" y="175.4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="175.0" dy="0.0">Old owner</tspan></text><text x="175.0" y="200.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="175.0" dy="0.0">fence 7 · lease expired</tspan></text><rect x="40.0" y="330.0" width="270.0" height="104.0" rx="16.0" fill="#BBF7D0" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="175.0" y="375.4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="175.0" dy="0.0">New owner</tspan></text><text x="175.0" y="400.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="175.0" dy="0.0">fence 8 · live lease</tspan></text><rect x="420.0" y="190.0" width="320.0" height="184.0" rx="16.0" fill="#DDD6FE" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="580.0" y="259.1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="580.0" dy="0.0">publish_derivation</tspan></text><text x="580.0" y="283.7" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="580.0" dy="0.0">re-reads the live claim row FOR UPDATE</tspan><tspan x="580.0" dy="16.2">and compares {owner_id, run_id, fence,</tspan><tspan x="580.0" dy="16.2">state} in the same transaction</tspan></text><rect x="850.0" y="130.0" width="320.0" height="104.0" rx="16.0" fill="#FECACA" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1010.0" y="167.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" dy="0.0">REJECTED_FENCE</tspan></text><text x="1010.0" y="191.2" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" dy="0.0">zero rows updated; the stale owner exits</tspan><tspan x="1010.0" dy="16.2">without writing</tspan></text><rect x="850.0" y="330.0" width="320.0" height="104.0" rx="16.0" fill="#BBF7D0" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1010.0" y="375.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" dy="0.0">committed</tspan></text><text x="1010.0" y="399.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1010.0" dy="0.0">the generation head advances</tspan></text><polyline points="310.0,182.0 365.0,182.0 365.0,250.0 420.0,250.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="420.0,250.0 409.0,254.4 409.0,245.6" fill="#334155" stroke="none"/><polyline points="310.0,382.0 365.0,382.0 365.0,314.0 420.0,314.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="420.0,314.0 409.0,318.4 409.0,309.6" fill="#334155" stroke="none"/><polyline points="740.0,250.0 795.0,250.0 795.0,182.0 850.0,182.0" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="850.0,182.0 839.0,186.4 839.0,177.6" fill="#DC2626" stroke="none"/><polyline points="740.0,314.0 795.0,314.0 795.0,382.0 850.0,382.0" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="850.0,382.0 839.0,386.4 839.0,377.6" fill="#059669" stroke="none"/><text x="605.0" y="504.4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="605.0" dy="0.0">The dispossessed owner is not asked to behave. It is structurally unable to.</tspan></text></svg>
