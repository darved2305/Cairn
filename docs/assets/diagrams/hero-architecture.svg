<svg xmlns="http://www.w3.org/2000/svg" width="1662" height="588" viewBox="-4.0 -4.0 1662.0 588.1" role="img"><rect x="-4.0" y="-4.0" width="1662.0" height="588.1" fill="#FFFFFF"/><text x="40.0" y="43.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Cairn — system architecture</tspan></text><text x="40.0" y="67.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Every caller resolves to one execution identity. CockroachDB decides. Workers are disposable. S3 only holds bytes.</tspan></text><rect x="24.0" y="116.0" width="232.0" height="320.0" rx="16.0" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><text x="40.0" y="139.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">CALLERS</tspan></text><rect x="40.0" y="152.0" width="200.0" height="74.0" rx="16.0" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="140.0" y="182.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="140.0" dy="0.0">Laptop</tspan></text><text x="140.0" y="205.6" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="140.0" dy="0.0">cairn exec</tspan></text><rect x="40.0" y="248.0" width="200.0" height="74.0" rx="16.0" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="140.0" y="278.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="140.0" dy="0.0">GitHub Actions</tspan></text><text x="140.0" y="301.6" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="140.0" dy="0.0">composite action</tspan></text><rect x="40.0" y="344.0" width="200.0" height="74.0" rx="16.0" fill="#FFFFFF" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="140.0" y="374.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="140.0" dy="0.0">ECS Fargate</tspan></text><text x="140.0" y="397.6" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="140.0" dy="0.0">same OCI digest</tspan></text><rect x="310.0" y="210.0" width="230.0" height="180.0" rx="16.0" fill="#DDD6FE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="425.0" y="277.1" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="425.0" dy="0.0">cairn exec</tspan></text><text x="425.0" y="301.7" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="425.0" dy="0.0">supervise the command,</tspan><tspan x="425.0" dy="16.2">normalise its syscall trace,</tspan><tspan x="425.0" dy="16.2">derive one semantic work key</tspan></text><rect x="610.0" y="210.0" width="240.0" height="180.0" rx="16.0" fill="#FEF3C7" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="730.0" y="277.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="730.0" dy="0.0">Execution planner</tspan></text><text x="730.0" y="301.7" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="730.0" dy="0.0">RESTORE · SUBSCRIBE ·</tspan><tspan x="730.0" dy="16.2">TAKE_OVER · REPAIR · RUN — or</tspan><tspan x="730.0" dy="16.2">refuse the plan</tspan></text><rect x="950.0" y="100.0" width="330.0" height="420.0" rx="16.0" fill="#DDD6FE" stroke="#C4B5FD" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1115.0" y="144.4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1115.0" dy="0.0">CockroachDB</tspan></text><text x="1115.0" y="170.4" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#64748B" text-anchor="middle" xml:space="preserve"><tspan x="1115.0" dy="0.0">authority + memory</tspan></text><rect x="974.0" y="200.0" width="282.0" height="56.0" rx="14.0" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1115.0" y="231.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1115.0" dy="0.0">work_claims · fences · leases</tspan></text><rect x="974.0" y="268.0" width="282.0" height="56.0" rx="14.0" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1115.0" y="299.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1115.0" dy="0.0">work_generations · derivations</tspan></text><rect x="974.0" y="336.0" width="282.0" height="56.0" rx="14.0" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1115.0" y="367.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1115.0" dy="0.0">trace_observations · rules</tspan></text><rect x="974.0" y="404.0" width="282.0" height="56.0" rx="14.0" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1115.0" y="435.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1115.0" dy="0.0">failure_signatures · decisions</tspan></text><rect x="1380.0" y="150.0" width="250.0" height="130.0" rx="16.0" fill="#BBF7D0" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1505.0" y="200.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1505.0" dy="0.0">Workers</tspan></text><text x="1505.0" y="224.8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1505.0" dy="0.0">ECS Fargate or a local shell —</tspan><tspan x="1505.0" dy="16.2">no state of their own</tspan></text><rect x="1380.0" y="380.0" width="250.0" height="130.0" rx="16.0" fill="#BFDBFE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1505.0" y="430.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1505.0" dy="0.0">Amazon S3</tspan></text><text x="1505.0" y="454.8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1505.0" dy="0.0">content-addressed blobs under</tspan><tspan x="1505.0" dy="16.2">cas/sha256/&lt;digest&gt;</tspan></text><polyline points="240.0,189.0 310.0,255.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="310.0,255.0 298.9,250.7 305.0,244.2" fill="#334155" stroke="none"/><polyline points="240.0,285.0 310.0,300.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="310.0,300.0 298.3,302.0 300.2,293.3" fill="#334155" stroke="none"/><polyline points="240.0,381.0 310.0,345.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="310.0,345.0 302.3,354.0 298.2,346.1" fill="#334155" stroke="none"/><polyline points="540.0,300.0 610.0,300.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="610.0,300.0 599.0,304.4 599.0,295.6" fill="#334155" stroke="none"/><polyline points="850.0,300.0 950.0,300.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="950.0,300.0 939.0,304.4 939.0,295.6" fill="#334155" stroke="none"/><polygon points="850.0,300.0 861.0,295.6 861.0,304.4" fill="#334155" stroke="none"/><text x="900.0" y="281.4" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="11.5" font-weight="600" fill="#64748B" text-anchor="middle" xml:space="preserve"><tspan x="900.0" dy="0.0">SERIALIZABLE</tspan></text><polyline points="1280.0,215.0 1380.0,215.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1380.0,215.0 1369.0,219.4 1369.0,210.6" fill="#334155" stroke="none"/><rect x="1313.1" y="204.5" width="33.8" height="21.0" rx="5.2" fill="#FFFFFF" stroke="transparent" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1330.0" y="218.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" xml:space="preserve"><tspan x="1330.0" dy="0.0">run</tspan></text><polyline points="1505.0,280.0 1505.0,380.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1505.0,380.0 1500.6,369.0 1509.4,369.0" fill="#334155" stroke="none"/><rect x="1466.3" y="319.5" width="77.3" height="21.0" rx="5.2" fill="#FFFFFF" stroke="transparent" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1505.0" y="333.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" xml:space="preserve"><tspan x="1505.0" dy="0.0">put bytes</tspan></text><polyline points="1380.0,445.0 1280.0,445.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><polygon points="1280.0,445.0 1291.0,440.6 1291.0,449.4" fill="#334155" stroke="none"/><rect x="1302.2" y="434.5" width="55.6" height="21.0" rx="5.2" fill="#FFFFFF" stroke="transparent" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1330.0" y="448.5" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle" xml:space="preserve"><tspan x="1330.0" dy="0.0">digest</tspan></text><text x="1505.0" y="551.8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94A3B8" text-anchor="middle" xml:space="preserve"><tspan x="1505.0" dy="0.0">S3 stores. It never decides.</tspan></text><text x="40.0" y="483.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#64748B" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Identical work launched from a laptop, from CI, and from Fargate</tspan><tspan x="40.0" dy="18.1">resolves to the same semantic work key — which is why they can join</tspan><tspan x="40.0" dy="18.1">one execution instead of paying for three.</tspan></text></svg>
