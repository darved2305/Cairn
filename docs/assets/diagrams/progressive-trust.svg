<svg xmlns="http://www.w3.org/2000/svg" width="1766" height="469" viewBox="12.0 -4.0 1766.0 468.8" role="img"><rect x="12.0" y="-4.0" width="1766.0" height="468.8" fill="#FFFFFF"/><text x="40.0" y="43.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Progressive trust</tspan></text><text x="40.0" y="67.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">Nothing forces you past the step you are willing to trust.</tspan></text><rect x="40.0" y="160.0" width="250.0" height="190.0" rx="16.0" fill="#F8FAFC" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="165.0" y="231.6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="165.0" dy="0.0">cairn scout</tspan></text><text x="165.0" y="255.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="165.0" dy="0.0">Trace a command and record the</tspan><tspan x="165.0" dy="16.2">evidence. Never reuses</tspan><tspan x="165.0" dy="16.2">anything.</tspan></text><rect x="332.0" y="160.0" width="250.0" height="190.0" rx="16.0" fill="#BFDBFE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="457.0" y="231.6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="457.0" dy="0.0">--contract shadow</tspan></text><text x="457.0" y="255.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="457.0" dy="0.0">Plan, run, and compare against</tspan><tspan x="457.0" dy="16.2">what memory says. Still never</tspan><tspan x="457.0" dy="16.2">reuses.</tspan></text><rect x="624.0" y="160.0" width="250.0" height="190.0" rx="16.0" fill="#DDD6FE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="749.0" y="231.6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="749.0" dy="0.0">--qualify</tspan></text><text x="749.0" y="255.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="749.0" dy="0.0">Run the candidate twice.</tspan><tspan x="749.0" dy="16.2">Promote CANDIDATE → VALIDATED</tspan><tspan x="749.0" dy="16.2">only on an exact match.</tspan></text><rect x="916.0" y="160.0" width="250.0" height="190.0" rx="16.0" fill="#FEF3C7" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1041.0" y="231.6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1041.0" dy="0.0">deterministic-file/v1</tspan></text><text x="1041.0" y="255.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1041.0" dy="0.0">Declared purity. Verified</tspan><tspan x="1041.0" dy="16.2">whole-result restore of one</tspan><tspan x="1041.0" dy="16.2">output file.</tspan></text><rect x="1208.0" y="160.0" width="250.0" height="190.0" rx="16.0" fill="#BBF7D0" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1333.0" y="231.6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1333.0" dy="0.0">--remote ecs</tspan></text><text x="1333.0" y="255.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1333.0" dy="0.0">The same immutable image digest</tspan><tspan x="1333.0" dy="16.2">on Fargate, in a</tspan><tspan x="1333.0" dy="16.2">topology-authorized region.</tspan></text><rect x="1500.0" y="160.0" width="250.0" height="190.0" rx="16.0" fill="#BBF7D0" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1625.0" y="239.7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="15" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1625.0" dy="0.0">jsonl-map/v1</tspan></text><text x="1625.0" y="263.6" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1625.0" dy="0.0">Adapter contract with 64 stable</tspan><tspan x="1625.0" dy="16.2">leaves and leaf-level repair.</tspan></text><polyline points="40.0,400.0 1750.0,400.0" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1750.0,400.0 1739.0,404.4 1739.0,395.6" fill="#94A3B8" stroke="none"/><text x="895.0" y="432.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#64748B" text-anchor="middle" xml:space="preserve"><tspan x="895.0" dy="0.0">adopt left to right</tspan></text></svg>
