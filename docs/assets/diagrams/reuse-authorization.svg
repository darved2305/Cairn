<svg xmlns="http://www.w3.org/2000/svg" width="1376" height="657" viewBox="12.0 -4.0 1376.0 656.8" role="img"><rect x="12.0" y="-4.0" width="1376.0" height="656.8" fill="#FFFFFF"/><text x="40.0" y="43.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#111827" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">How Cairn authorizes reuse</tspan></text><text x="40.0" y="67.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#64748B" text-anchor="start" xml:space="preserve"><tspan x="40.0" dy="0.0">A proposal is not permission.</tspan></text><rect x="40.0" y="250.0" width="240.0" height="120.0" rx="16.0" fill="#F8FAFC" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="160.0" y="295.3" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="160.0" dy="0.0">Proposal</tspan></text><text x="160.0" y="319.8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="160.0" dy="0.0">a rule — or a model —</tspan><tspan x="160.0" dy="16.2">suggests reuse</tspan></text><rect x="350.0" y="120.0" width="290.0" height="116.0" rx="16.0" fill="#DDD6FE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495.0" y="163.0" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="495.0" dy="0.0">identity</tspan></text><text x="495.0" y="187.2" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="495.0" dy="0.0">the same semantic work key over a</tspan><tspan x="495.0" dy="16.2">VALIDATED observation</tspan></text><polyline points="280.0,310.0 315.0,310.0 315.0,178.0 350.0,178.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="350.0,178.0 339.0,182.4 339.0,173.6" fill="#334155" stroke="none"/><polyline points="640.0,178.0 685.0,178.0 685.0,310.0 720.0,310.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="720.0,310.0 709.0,314.4 709.0,305.6" fill="#334155" stroke="none"/><rect x="350.0" y="250.0" width="290.0" height="116.0" rx="16.0" fill="#DDD6FE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495.0" y="284.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="495.0" dy="0.0">structural</tspan></text><text x="495.0" y="309.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="495.0" dy="0.0">a declared adapter contract, or the</tspan><tspan x="495.0" dy="16.2">change provably cannot reach this</tspan><tspan x="495.0" dy="16.2">artifact</tspan></text><polyline points="280.0,310.0 315.0,310.0 315.0,308.0 350.0,308.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="350.0,308.0 339.0,312.4 339.0,303.6" fill="#334155" stroke="none"/><polyline points="640.0,308.0 685.0,308.0 685.0,310.0 720.0,310.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="720.0,310.0 709.0,314.4 709.0,305.6" fill="#334155" stroke="none"/><rect x="350.0" y="380.0" width="290.0" height="116.0" rx="16.0" fill="#DDD6FE" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495.0" y="414.8" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="16" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="495.0" dy="0.0">probe</tspan></text><text x="495.0" y="439.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="495.0" dy="0.0">recompute a bounded,</tspan><tspan x="495.0" dy="16.2">deterministically-chosen sample and</tspan><tspan x="495.0" dy="16.2">compare canonical bytes</tspan></text><polyline points="280.0,310.0 315.0,310.0 315.0,438.0 350.0,438.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="350.0,438.0 339.0,442.4 339.0,433.6" fill="#334155" stroke="none"/><polyline points="640.0,438.0 685.0,438.0 685.0,310.0 720.0,310.0" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="720.0,310.0 709.0,314.4 709.0,305.6" fill="#334155" stroke="none"/><rect x="720.0" y="240.0" width="280.0" height="140.0" rx="16.0" fill="#BBF7D0" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="860.0" y="295.3" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="17" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="860.0" dy="0.0">authorized_by</tspan></text><text x="860.0" y="319.8" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="860.0" dy="0.0">identity | structural | probe —</tspan><tspan x="860.0" dy="16.2">enforced by a CHECK constraint</tspan></text><rect x="1080.0" y="150.0" width="280.0" height="116.0" rx="16.0" fill="#BBF7D0" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1220.0" y="201.7" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="18" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1220.0" dy="0.0">REUSE</tspan></text><text x="1220.0" y="226.6" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1220.0" dy="0.0">restore the recorded result</tspan></text><rect x="1080.0" y="400.0" width="280.0" height="116.0" rx="16.0" fill="#FECACA" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1220.0" y="443.6" font-family="ui-monospace, SFMono-Regular, 'SF Mono', 'Cascadia Code', Consolas, monospace" font-size="18" font-weight="600" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="1220.0" dy="0.0">RUN</tspan></text><text x="1220.0" y="468.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="middle" xml:space="preserve"><tspan x="1220.0" dy="0.0">insufficient or contradictory</tspan><tspan x="1220.0" dy="16.2">evidence</tspan></text><polyline points="1000.0,285.0 1040.0,285.0 1040.0,208.0 1080.0,208.0" fill="none" stroke="#059669" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1080.0,208.0 1069.0,212.4 1069.0,203.6" fill="#059669" stroke="none"/><polyline points="1000.0,335.0 1040.0,335.0 1040.0,458.0 1080.0,458.0" fill="none" stroke="#DC2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1080.0,458.0 1069.0,462.4 1069.0,453.6" fill="#DC2626" stroke="none"/><text x="700.0" y="585.6" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#111827" text-anchor="middle" xml:space="preserve"><tspan x="700.0" dy="0.0">Models may propose. Deterministic evidence authorizes.</tspan></text><text x="700.0" y="620.1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#64748B" text-anchor="middle" xml:space="preserve"><tspan x="700.0" dy="0.0">There is no enum value 'model'. A model-authorized reuse is not representable in the schema.</tspan></text></svg>
