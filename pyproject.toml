[project]
name = "cairn"
version = "0.1.0"
description = "Causal reuse memory for expensive compute."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2,<4",
    "typer>=0.15",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "torch>=2.5",
    "sentence-transformers>=3.2",
    "scikit-learn>=1.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "boto3>=1.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=0.40",
]

[project.scripts]
cairn = "cairn.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn"]

# CPU-only torch — the demo runs on Fargate CPU, not GPU (PROJECT.md §5.1
# rejected GPU workloads for quota/cold-start reasons), and the default
# PyPI wheel drags in ~2GB of CUDA runtime nobody here uses.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
# Never touch docs — ruff's markdown-fence formatting would otherwise
# rewrite the Python snippets embedded in PLAN.md/PROJECT.md, which are
# locked planning documents, not source code owned by this tool.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # ruff format owns line length

[tool.ruff.lint.isort]
known-first-party = ["cairn"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
# The real target is the Fargate/Docker container (Linux), not whatever OS
# this happens to be developed on — matters for platform-guarded stdlib
# modules like `resource` in workload/determinism.py.
platform = "linux"
# psycopg's pool/binary extras don't ship complete stubs; unblock strict mode
# on the rest of the codebase rather than sprinkling `type: ignore`.
[[tool.mypy.overrides]]
module = "psycopg.*"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "sklearn.*", "pandas.*", "pyarrow.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a live CockroachDB cluster (CAIRN_DATABASE_URL)",
]
