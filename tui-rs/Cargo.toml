[workspace]
resolver = "2"
members = [
    "crates/cairn-protocol",
    "crates/cairn-backend",
    "crates/cairn-state",
    "crates/cairn-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "Apache-2.0"
repository = "https://github.com/darved2305/cairn"

[workspace.dependencies]
cairn-protocol = { path = "crates/cairn-protocol" }
cairn-backend = { path = "crates/cairn-backend" }
cairn-state = { path = "crates/cairn-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam-channel = "0.5"
uuid = { version = "1", features = ["v4"] }
ratatui = "0.29"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
